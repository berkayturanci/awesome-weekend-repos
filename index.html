  const overlay = document.getElementById("overlay");

  function openCard(r) {
    dialogImg.src = r.thumb || "";
    dialogImg.alt = r.fullName;
    dialogName.textContent = r.fullName;
    dialogMeta.innerHTML = [
      r.stars ? `<span class="pill">★ ${r.stars}</span>` : "",

    if (r.tiktok) links.push(`<a href="${r.tiktok}" target="_blank" rel="noopener">TikTok</a>`);
    links.push(`<a href="${r.url}" target="_blank" rel="noopener">GitHub ↗</a>`);
    dialogLinks.innerHTML = links.join("");

  }

  function closeDialog() { overlay.classList.remove("open"); }

  document.getElementById("grid").addEventListener("click", (e) => {

  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeDialog(); });

  const searchInput = document.getElementById("search");
  const emptyState = document.getElementById("emptyState");
  const resultCount = document.getElementById("resultCount");
  const clearFiltersBtn = document.getElementById("clearFilters");
  const cards = Array.from(document.querySelectorAll(".card"));
  const chips = Array.from(document.querySelectorAll(".chip"));

  let activeLang = "";
  function setActiveChip(lang) {
    activeLang = lang;
    chips.forEach((chip) => {
      const on = (chip.dataset.lang || "") === lang;
      chip.classList.toggle("active", on);
      chip.setAttribute("aria-pressed", String(on));
    });
  }
  // Keeps the active language filter in the URL hash — a filtered link is
  // shareable/bookmarkable, and reloading keeps you where you were.
  function syncHash() {
    const hash = activeLang ? `#lang=${encodeURIComponent(activeLang)}` : "";
    history.replaceState(null, "", location.pathname + location.search + hash);
  }
  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    let visible = 0;
    cards.forEach((card, i) => {
      const r = REPOS[i];
      const matchesSearch = !q || [r.fullName, r.language, r.promise].join(" ").toLowerCase().includes(q);
      const matchesLang = !activeLang || r.language === activeLang;
      const match = matchesSearch && matchesLang;
      card.classList.toggle("hidden", !match);
      if (match) visible++;
    });
    emptyState.style.display = visible ? "none" : "block";
    resultCount.textContent = visible && (q || activeLang) ? `Showing ${visible} of ${cards.length}` : "";
  }
  searchInput.addEventListener("input", applyFilters);
  chips.forEach((chip) => {
    chip.addEventListener("click", () => {
      setActiveChip(chip.dataset.lang || "");
      syncHash();
      applyFilters();
    });
  });
  clearFiltersBtn.addEventListener("click", () => {
    searchInput.value = "";
    setActiveChip("");
    syncHash();
    applyFilters();
  });

  // Restore a #lang=Go style link on load.
  const hashLang = decodeURIComponent(location.hash.replace(/^#lang=/, ""));
  if (hashLang && chips.some((c) => c.dataset.lang === hashLang)) {
    setActiveChip(hashLang);
  }
  applyFilters();

  // ---- motion: scroll-in reveal, cursor tilt + glare, ambient glow ----
  // All gated on a real mouse (hover:hover + pointer:fine) and on the user
  // not having asked their OS for reduced motion — most visitors here are
  // on mobile (see channel analytics), so this never adds JS cost for them.
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  if (reduceMotion) {
    cards.forEach((c) => c.classList.add("in-view"));
  } else if ("IntersectionObserver" in window) {
    let revealed = 0;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          el.style.transitionDelay = `${Math.min(revealed % 8, 7) * 55}ms`;
          el.classList.add("in-view");
          revealed++;
          io.unobserve(el);
        });
      },
      { threshold: 0.15, rootMargin: "0px 0px -30px 0px" }
    );
    cards.forEach((c) => io.observe(c));
  } else {
    cards.forEach((c) => c.classList.add("in-view"));
  }

  if (canHover && !reduceMotion) {
    const MAX_TILT = 10;
    cards.forEach((card) => {
      card.addEventListener("pointerenter", () => card.classList.add("tilting"));
      card.addEventListener("pointermove", (e) => {
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        const rx = ((0.5 - py) * MAX_TILT).toFixed(2);
        const ry = ((px - 0.5) * MAX_TILT).toFixed(2);
        card.style.transform = `translateY(-6px) perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.03)`;
        card.style.setProperty("--mx", `${px * 100}%`);
        card.style.setProperty("--my", `${py * 100}%`);
      });
      card.addEventListener("pointerleave", () => {
        card.classList.remove("tilting");
        card.style.transform = "";
      });
    });

    const glow = document.getElementById("bgGlow");
    let raf = null;
    let gx = 50, gy = 26;
    document.addEventListener("pointermove", (e) => {
      gx = (e.clientX / window.innerWidth) * 100;
      gy = (e.clientY / window.innerHeight) * 100;
      if (raf) return;
      raf = requestAnimationFrame(() => {
        glow.style.setProperty("--mx", `${gx}%`);
        glow.style.setProperty("--my", `${gy}%`);
        raf = null;
      });
    });
  }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Repo Not Found · Awesome Weekend Repos</title>
<meta name="description" content="The page or repository you are looking for does not exist or has moved." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0b0b0d" id="themeColorMeta404" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<script>
  (function() {
    try {
      var saved = localStorage.getItem('aw_theme') || 'auto';
      var systemIsLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var activeTheme = saved === 'auto' ? (systemIsLight ? 'light' : 'dark') : saved;
      document.documentElement.setAttribute('data-theme', activeTheme);
      document.documentElement.setAttribute('data-theme-mode', saved);
      var meta = document.getElementById('themeColorMeta404');
      if (meta) meta.setAttribute('content', activeTheme === 'light' ? '#f8fafc' : '#0b0b0d');
    } catch(e) {}
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg-base: #0b0b0d;
    --text-primary: #f2f2f4;
    --text-muted: #94a3b8;
    --card-bg: rgba(18, 18, 22, 0.9);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg-base: #f8fafc;
    --text-primary: #0f172a;
    --text-muted: #475569;
    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.12);
    --card-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-base); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(640px circle at 50% 30%, rgba(91, 140, 255, 0.15), transparent 60%);
  }
  html[data-theme="light"] .bg-glow { opacity: 0.35; }
  .card-404 {
    position: relative; z-index: 1; max-width: 520px; width: 90%; text-align: center;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 24px; padding: 48px 32px; box-shadow: var(--card-shadow);
  }
  .badge-404 {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700;
    color: #5b8cff; background: rgba(91, 140, 255, 0.1); border: 1px solid rgba(91, 140, 255, 0.25);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 20px; letter-spacing: 0.05em;
  }
  h1 { font-size: 2.5rem; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-primary); }
  p { font-size: 1.05rem; color: var(--text-muted); margin: 0 0 28px; line-height: 1.5; }
  .btn-home {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 600;
    color: #fff; background: #2563eb; text-decoration: none; padding: 12px 24px; border-radius: 12px;
    transition: all 0.15s ease; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  }
  .btn-home:hover { background: #1d4ed8; transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card-404">
    <div class="badge-404">ERROR 404</div>
    <h1>Repo Not Found</h1>
    <p>The page or repository you are looking for does not exist or has moved.</p>
    <a class="btn-home" href="https://berkayturanci.github.io/awesome-weekend-repos/">← Explore 50+ Curated Repos</a>
  </div>
</body>
</html>
